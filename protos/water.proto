syntax="proto3";

package water;

service WaterMonitor{
  rpc GetWaterQuality(WaterRequest) returns (WaterQuality){}
  rpc StreamWaterLevels(WaterRequest) returns (stream WaterLevel){}
  rpc ReportPollutionEvent(stream PollutionReading) returns (PollutionEventSummary){}
  rpc PollutionAlertChannel(stream MonitorRequest) returns (stream PollutionAlert){}
}

message WaterRequest{
  string source_id=1;
}

message WaterQuality{
  double ph_level=1;
  double pollutant_ppm=2;
  double flow_rate=3;
  string status=4;
}

message PollutionEventSummary{
  string event_id=1;
  int32 readings_logged=2;
  double max_pollutant=3;
}

message PollutionReading{
  string source_id=1;
  double pollutant_ppm=2;
  string timestamp=3;
}

message PollutionAlert{
  string source_id = 1;
  double pollutant_ppm = 2;
  double alert_threshold_ppm = 3;
  string message = 4;
  string severity = 5;
  string timestamp = 6;
}

message WaterLevel{
  string source_id=1;
  double level_metres=2;
  string timestamp=3;
}

message MonitorRequest{
  string source_id=1;
  double alert_threshold_ppm=2;
}