syntax="proto3"

package forest;

service ForestMonitor{
  rpc GetCurrentReading(ForestRequest) returns (ForestReading){}
  rpc StreamLiveReadings(ForestRequest) returns (stream ForestReading){}
  rpc MonitorAlertChannel(stream AlertConfig) returns (stream ForestAlert){}
}

message ForestRequest{
  string location=1;
}

message ForestReading{
  string location=1;
  float humidity=2;
  float co2_level=3;
  float oxygen_level=4;
  string timestamp=5;
}

message AlertConfig{
  string location=1;
  float humidity_threshold=2;
  co2_threshold=3;
}

message ForestAlert{
  string location=1;
  string message=2;
  string severity=3;
  string timestamp;
}